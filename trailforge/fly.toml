# Fly.io config for Trailforge API.
# Create the app once:
#   cd intro/trailforge
#   fly launch --no-deploy --copy-config --name trailforge-api --region nrt
# Set secrets (DATABASE_URL, JWT_SECRET, ANTHROPIC_API_KEY) before first deploy:
#   fly secrets set DATABASE_URL=... JWT_SECRET=... ANTHROPIC_API_KEY=...
# Deploy from the trailforge/ directory (the Dockerfile context is trailforge/, not api/):
#   fly deploy --dockerfile api/Dockerfile

app = "trailforge-api"
primary_region = "sin"   # Singapore — co-located with Neon ap-southeast-1; ~30ms to TW clients

[build]
  dockerfile = "api/Dockerfile"

[env]
  PORT = "4100"
  NODE_ENV = "production"
  TRAILFORGE_MODEL = "claude-haiku-4-5-20251001"
  ALLOWED_ORIGINS = "https://aiwalkcorp.com,https://aiwalkcorp.pages.dev,https://trailforge.aiwalkcorp.com"

[http_service]
  internal_port = 4100
  force_https = true
  # Keep one machine always running so login/register doesn't pay cold-start
  # latency (~400ms-1s) on every first request. shared-cpu-1x ~$2-3/month.
  # Burst still scales up via auto_start; idle machines past min suspend.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
