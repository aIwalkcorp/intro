# Fly.io config for Trailforge API.
# Create the app once:
#   cd intro/trailforge
#   fly launch --no-deploy --copy-config --name trailforge-api --region nrt
# Set secrets (DATABASE_URL, JWT_SECRET, ANTHROPIC_API_KEY) before first deploy:
#   fly secrets set DATABASE_URL=... JWT_SECRET=... ANTHROPIC_API_KEY=...
# Deploy from the trailforge/ directory (the Dockerfile context is trailforge/, not api/):
#   fly deploy --dockerfile api/Dockerfile

app = "trailforge-api"
primary_region = "sin"   # Singapore — co-located with Neon ap-southeast-1; ~30ms to TW clients

[build]
  dockerfile = "api/Dockerfile"

[env]
  PORT = "4100"
  NODE_ENV = "production"
  TRAILFORGE_MODEL = "claude-haiku-4-5-20251001"
  ALLOWED_ORIGINS = "https://aiwalkcorp.com,https://aiwalkcorp.pages.dev,https://trailforge.aiwalkcorp.com"

[http_service]
  internal_port = 4100
  force_https = true
  # Cost-saving default: scale to zero when idle. First request after suspend
  # pays ~400ms-1s cold start. The frontend mitigates this by firing a
  # /healthz prefetch on auth.html load, so by submit time the machine is hot.
  # Bump min_machines_running to 1 (~$3-5/mo extra) once user volume warrants
  # always-on. See trailforge/api/PERFORMANCE.md for the trade-off + steps.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
