<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';">
<meta name="robots" content="noindex, nofollow">
<title>智意行科技 Digital Business Card</title>
<meta name="description" content="aIwalk Co., Ltd. - 智意行科技數位名片">
<meta property="og:title" content="智意行科技 Digital Business Card">
<meta property="og:description" content="aIwalk Co., Ltd. 數位名片">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aiwalkcorp.github.io/intro/card.html">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f8f6f1;
    /* Noto Sans TC first so CJK uses heavier-by-default rendering on high-DPI */
    font-family: 'Noto Sans TC', 'Inter', sans-serif;
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* ===== NAVBAR ===== */
  .page-navbar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 9999;
    display: flex; align-items: center; gap: 10px; padding: 8px 16px;
    background: rgba(255,255,255,0.82); backdrop-filter: blur(20px) saturate(1.8);
    -webkit-backdrop-filter: blur(20px) saturate(1.8);
    border-radius: 52px; border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 4px 24px rgba(0,0,0,0.08); white-space: nowrap;
  }
  .nav-back {
    display: flex; align-items: center; gap: 6px; padding: 5px 14px;
    border-radius: 24px; font-size: 13px; font-weight: 600;
    color: #1a3a5c; text-decoration: none; transition: all 0.2s ease;
  }
  .nav-back:hover { background: rgba(26,58,92,0.06); }
  .nav-back svg { width: 16px; height: 16px; }
  .nav-title { font-size: 14px; font-weight: 700; color: #1a3a5c; letter-spacing: 0.3px; }
  /* In team view, hide the "數位名片" label so the header reads as a team page */
  body.team-view .nav-title { display: none; }
  .nav-overview {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 16px;
    border-radius: 24px;
    font-size: 13.5px; font-weight: 700; letter-spacing: 0.4px;
    color: #fff;
    background: linear-gradient(135deg, #c06a1a 0%, #d4893a 100%);
    border: none; cursor: pointer;
    box-shadow:
      0 3px 12px rgba(192,106,26,0.35),
      0 0 0 0 rgba(255,180,90,0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    font-family: inherit;
    animation: navOverviewPulse 3.2s ease-in-out infinite;
  }
  @keyframes navOverviewPulse {
    0%, 100% { box-shadow: 0 3px 12px rgba(192,106,26,0.35), 0 0 0 0 rgba(255,180,90,0.55); }
    50%      { box-shadow: 0 5px 18px rgba(192,106,26,0.55), 0 0 0 10px rgba(255,180,90,0); }
  }
  .nav-overview:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(192,106,26,0.55);
    animation-play-state: paused;
  }
  .nav-overview svg { width: 15px; height: 15px; stroke-width: 2.4; }
  /* Two-line label: '經營團隊 Team' on top, tiny 'Overview' helper underneath */
  .nav-overview-label { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.05; gap: 1px; }
  .nav-overview-main { font-size: 13px; font-weight: 700; }
  .nav-overview-sub { font-size: 9px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.85; }
  @media (prefers-reduced-motion: reduce) { .nav-overview { animation: none; } }
  /* Nav label language switch: body[data-lang] drives visibility */
  body[data-lang="en"] .lbl-zh { display: none !important; }
  body[data-lang="zh"] .lbl-en { display: none !important; }

  /* ===== OVERVIEW OVERLAY ===== */
  .overview {
    position: fixed; inset: 0; z-index: 10000;
    background: #f8f6f1;
    overflow-y: auto;
    opacity: 0; pointer-events: none;
    transform: translateY(20px);
    transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .overview.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .overview-header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 28px 48px 20px; gap: 24px;
    background: linear-gradient(180deg, #f8f6f1 72%, rgba(248,246,241,0));
  }
  .overview-header > .overview-close { margin-top: 18px; flex-shrink: 0; }
  .overview-home-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; color: #6b7d8e;
    text-decoration: none; letter-spacing: 0.4px;
    margin-bottom: 12px; padding: 4px 10px 4px 6px;
    border: 1px solid rgba(26,58,92,0.12); border-radius: 999px;
    background: rgba(255,255,255,0.5); transition: all 0.2s ease;
    font-family: inherit;
  }
  .overview-home-link:hover {
    color: #1a3a5c; background: rgba(255,255,255,0.95);
    border-color: rgba(26,58,92,0.25); transform: translateX(-2px);
  }
  .overview-home-link svg { width: 12px; height: 12px; }
  .overview-eyebrow {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 11px; font-weight: 700; color: #c06a1a;
    letter-spacing: 4px; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .overview-title {
    font-family: 'Noto Serif TC', serif; font-size: 28px; font-weight: 900;
    color: #1a2d42; letter-spacing: 2px;
  }
  .overview-title::after {
    content: ''; display: inline-block; width: 28px; height: 3px;
    background: #c06a1a; margin-left: 14px; vertical-align: middle;
  }
  .overview-subtitle {
    font-size: 12px; color: #6b7d8e; letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 600;
  }
  .overview-close {
    display: inline-flex; align-items: center;
    background: linear-gradient(135deg, #c06a1a 0%, #d4893a 100%);
    border: none;
    border-radius: 999px; padding: 8px 18px; font-size: 12px;
    color: #fff; cursor: pointer; font-weight: 700; letter-spacing: 0.5px;
    transition: all 0.2s; font-family: inherit;
    box-shadow: 0 3px 12px rgba(192,106,26,0.32);
  }
  .overview-close:hover { transform: translateY(-1px); box-shadow: 0 5px 18px rgba(192,106,26,0.45); }
  .overview-actions { display: flex; gap: 10px; align-items: center; margin-top: 18px; flex-shrink: 0; }
  .overview-header > .overview-actions { margin-top: 18px; }
  .lang-pill {
    background: transparent; border: 1px solid rgba(26,58,92,0.2);
    border-radius: 999px; padding: 8px 14px; font-size: 11px;
    color: #1a3a5c; cursor: pointer; font-weight: 700; letter-spacing: 1px;
    transition: all 0.2s; font-family: 'Inter', inherit; min-width: 56px;
  }
  .lang-pill:hover { background: #c06a1a; color: #fff; border-color: #c06a1a; }
  body[data-lang="zh"] .lang-pill::before { content: 'EN'; }
  body[data-lang="en"] .lang-pill::before { content: '中'; }
  /* Profile topbar variant — sits beside the back button */
  .profile-topbar .lang-pill { color: #f4ecd8; border-color: rgba(244,236,216,0.3); }
  .profile-topbar .lang-pill:hover { background: #c06a1a; color: #fff; border-color: #c06a1a; }
  /* Page-navbar variant — compact pill inside the glass navbar */
  .nav-lang { padding: 5px 12px; font-size: 11px; min-width: 50px; border-color: rgba(26,58,92,0.18); }
  .overview-body { padding: 0 48px 64px; }
  .overview-group { margin-bottom: 48px; }
  .overview-group-head {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 18px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(26,58,92,0.12);
  }
  .overview-group-num {
    font-family: 'Inter', monospace; font-size: 11px; font-weight: 700;
    color: #c06a1a; letter-spacing: 2px;
  }
  .overview-group-zh {
    font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 700;
    color: #1a2d42; letter-spacing: 1.5px;
  }
  .overview-group-en {
    font-size: 11px; color: #6b7d8e; letter-spacing: 1px;
    text-transform: uppercase; font-weight: 600; margin-left: auto;
  }
  .overview-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .ov-card {
    position: relative; padding: 20px 22px 18px;
    background: #ffffff; border-radius: 8px;
    border: 1px solid rgba(26,58,92,0.08);
    cursor: pointer; text-align: left;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden; font-family: inherit;
  }
  .ov-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: linear-gradient(180deg, #1a3a5c, #c06a1a);
    transform: scaleY(0); transform-origin: top;
    transition: transform 0.3s ease;
  }
  .ov-card:hover {
    transform: translateY(-3px);
    border-color: rgba(192,106,26,0.3);
    box-shadow: 0 10px 30px rgba(26,58,92,0.08), 0 2px 8px rgba(0,0,0,0.04);
  }
  .ov-card:hover::before { transform: scaleY(1); }
  /* Primary name slot — large; lang-aware */
  .ov-name-primary {
    font-size: 32px; font-weight: 900;
    color: #1a2d42; line-height: 1.05;
    margin-bottom: 6px;
  }
  body[data-lang="zh"] .ov-name-primary {
    font-family: 'Noto Serif TC', serif; letter-spacing: 1px;
  }
  body[data-lang="en"] .ov-name-primary {
    font-family: 'Noto Serif TC', 'Inter', serif;
    letter-spacing: 0.3px; font-size: 24px; font-weight: 800;
  }
  /* Secondary name slot — small; lang-aware */
  .ov-name-secondary {
    font-size: 11px; color: #6b7d8e;
    font-weight: 500; margin-bottom: 10px;
  }
  body[data-lang="zh"] .ov-name-secondary {
    letter-spacing: 1px;
  }
  body[data-lang="en"] .ov-name-secondary {
    font-family: 'Noto Serif TC', serif;
    letter-spacing: 2px; font-weight: 600;
  }
  .ov-role {
    font-size: 12px; color: #1a3a5c; font-weight: 600;
    line-height: 1.5; letter-spacing: 0.3px;
  }
  .ov-role-sub {
    display: block; font-size: 10px; color: #94a3b8;
    font-weight: 500; letter-spacing: 0.5px; margin-top: 2px;
    text-transform: uppercase;
  }
  body[data-lang="en"] .ov-role-sub { text-transform: none; letter-spacing: 0.3px; }
  .ov-arrow {
    position: absolute; right: 16px; top: 20px;
    color: #c06a1a; opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    transform: translateX(-4px);
  }
  .ov-card:hover .ov-arrow { opacity: 1; transform: translateX(0); }
  @media (max-width: 640px) {
    .overview-header { padding: 20px 20px 14px; }
    .overview-body { padding: 0 20px 40px; }
    .overview-title { font-size: 22px; }
    .overview-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .ov-card { padding: 14px 16px; }
    .ov-name-primary { font-size: 26px; }
    body[data-lang="en"] .ov-name-primary { font-size: 20px; }
  }

  /* ===== STAGE ===== */
  .stage {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 70px 24px 24px;
    position: relative; user-select: none;
    overflow: hidden;
  }

  /* Person info */
  .person-label {
    font-size: 14px; font-weight: 700; color: #1a3a5c;
    letter-spacing: 1px; text-align: center; margin-bottom: 4px;
  }
  .person-sublabel {
    font-size: 11px; color: #64748b; font-weight: 600; letter-spacing: 0.5px;
    text-align: center; margin-bottom: 16px;
  }

  /* Card flipper */
  .card-scene {
    perspective: 1200px;
    width: 108mm; height: 64.8mm;
    transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                height 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }
  /* Ack cards are a distinct, larger format — like a printed attestation */
  .card-scene.is-ack {
    width: 132mm; height: 88mm;
  }
  .card-flipper {
    position: relative; width: 100%; height: 100%;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
  }
  .card-flipper.flipped {
    transform: rotateX(-180deg);
  }
  .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .card-face-front {
    transform: rotateX(0deg) translateZ(1px);
  }
  .card-face-back {
    transform: rotateX(180deg) translateZ(0px);
  }

  /* ===== BASE CARD ===== */
  .card {
    width: 100%; height: 100%;
    border-radius: 3.5mm; position: relative; overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.08);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 5.5mm 6mm;
  }
  .top { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .logo { width: 16mm; height: 16mm; border-radius: 3mm; overflow: hidden; flex-shrink: 0; }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .co { display: flex; flex-direction: column; gap: 0.3mm; flex: 1; }
  .co-names { display: flex; align-items: baseline; gap: 2mm; }
  .co-zh { font-family: 'Noto Sans TC', sans-serif; font-size: 3.8mm; font-weight: 700; letter-spacing: 1.2px; }
  .co-en-sub { font-size: 5mm; font-weight: 700; letter-spacing: 0.5px; }
  .serif-i { font-family: 'Noto Serif TC', 'Times New Roman', serif; }
  .mid { position: relative; z-index: 1; }
  .sep { height: 0.4mm; margin-bottom: 2mm; }
  .name-row { display: flex; align-items: baseline; gap: 2mm; }
  .name-zh { font-family: 'Noto Serif TC', sans-serif; font-size: 6mm; font-weight: 900; letter-spacing: 2px; }
  .name-en { font-family: 'Inter', sans-serif; font-size: 5.4mm; font-weight: 700; letter-spacing: 0.8px; }
  .phd { font-size: 3.4mm; font-weight: 700; letter-spacing: 0.5px; }
  .phd-en { font-size: 2.6mm; font-weight: 500; letter-spacing: 0.3px; }
  .title { font-family: 'Noto Sans TC', sans-serif; font-size: 2.5mm; font-weight: 500; letter-spacing: 0.8px; margin-top: 1mm; }
  .bot { display: flex; flex-direction: column; gap: 1.3mm; position: relative; z-index: 1; align-self: flex-end; align-items: flex-start; }
  .crow { display: flex; align-items: center; gap: 2mm; }
  .ci-zh { font-family: 'Noto Sans TC', sans-serif; font-size: 2mm; font-weight: 600; flex-shrink: 0; letter-spacing: 0.5px; }
  .ci-en { font-family: 'Inter', sans-serif; font-size: 1.8mm; font-weight: 600; flex-shrink: 0; letter-spacing: 0.3px; width: 8mm; }
  .ct { font-family: 'Noto Sans TC', 'Inter', sans-serif; font-size: 2.2mm; font-weight: 500; letter-spacing: 0.2px; }
  .addr-wrap { line-height: 1.6; }

  /* Style B */
  .style-b { background: #ffffff; border: 0.2mm solid #eae6e2; }
  .style-b::before { content: ''; position: absolute; top: 0; left: 0; width: 1.2mm; height: 100%; background: linear-gradient(180deg, #1a3a5c, #c06a1a, #d4893a); border-radius: 3.5mm 0 0 3.5mm; }
  .style-b .co-zh { color: #1a3a5c; }
  .style-b .co-en-sub { color: #1a3a5c; }
  .style-b .co-en-sub .ac { color: #c06a1a; }
  .style-b .sep { background: linear-gradient(90deg, #c06a1a33, transparent); }
  .style-b .name-zh { color: #1a2d42; }
  .style-b .name-en { color: #1a2d42; }
  .style-b .phd { color: #c06a1a; }
  .style-b .phd-en { color: #6b7d8e; }
  .style-b .title { color: #6b7d8e; }
  .style-b .ci-zh, .style-b .ci-en { color: #c06a1a; }
  .style-b .ct { color: #7a8a9a; }

  /* ===== Style Ack — Acknowledgment / attestation card =====
     Deliberately DIFFERENT from business card style-b so viewers
     immediately understand these people are NOT employees. */
  .style-ack {
    background:
      radial-gradient(ellipse at 20% 10%, rgba(154, 122, 62, 0.10), transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(124, 45, 45, 0.08), transparent 55%),
      linear-gradient(135deg, #f5ead4 0%, #efe0c3 50%, #ead5ac 100%);
    border: 0.25mm solid #b89157;
    padding: 4.5mm 6mm 5mm;
    justify-content: flex-start;
  }
  /* Paper grain */
  .style-ack::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image:
      repeating-linear-gradient(45deg, rgba(124,78,33,0.025) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(-45deg, rgba(124,78,33,0.02) 0 1px, transparent 1px 4px);
    mix-blend-mode: multiply;
  }
  /* Inner double-line frame */
  .style-ack::after {
    content: ''; position: absolute;
    inset: 2.2mm;
    border: 0.15mm solid rgba(154, 122, 62, 0.55);
    outline: 0.1mm solid rgba(154, 122, 62, 0.25);
    outline-offset: 0.6mm;
    pointer-events: none;
    border-radius: 1.5mm;
  }
  .ack-top {
    display: flex; align-items: center; justify-content: center; gap: 4mm;
    position: relative; z-index: 2;
    margin-top: 1.5mm;
  }
  .ack-fleuron {
    font-family: 'Fraunces', 'Noto Serif TC', serif;
    font-size: 5mm; color: #9a7a3e; line-height: 1;
    transform: translateY(-0.3mm);
  }
  .ack-eyebrow {
    font-family: 'Fraunces', 'Noto Serif TC', serif;
    font-size: 4.2mm; letter-spacing: 6px; font-weight: 600;
    color: #5e3a1c; text-align: center;
  }
  .ack-eyebrow-sub {
    font-family: 'Fraunces', serif;
    font-size: 1.8mm; letter-spacing: 3.5px; font-weight: 500;
    color: #9a7a3e; text-align: center;
    margin-top: 0.4mm; font-style: italic;
  }
  .ack-rule {
    height: 0.15mm;
    background: linear-gradient(90deg, transparent, rgba(154,122,62,0.55) 20%, rgba(154,122,62,0.55) 80%, transparent);
    margin: 2mm 0;
    position: relative; z-index: 2;
  }
  .ack-rule.thin { opacity: 0.45; margin: 1.5mm 0; }
  .ack-body {
    position: relative; z-index: 2;
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
    gap: 1mm;
    padding: 1mm 0;
  }
  .ack-role {
    font-family: 'Noto Sans TC', 'Inter', sans-serif;
    font-size: 2.3mm; letter-spacing: 2.5px; font-weight: 500;
    color: #8a6a38; text-transform: uppercase;
  }
  .ack-role-zh {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 2.4mm; letter-spacing: 3px; font-weight: 500;
    color: #8a6a38;
  }
  .ack-name-zh {
    font-family: 'Noto Serif TC', serif;
    font-size: 7.2mm; font-weight: 900; letter-spacing: 5px;
    color: #3e2410; margin-top: 0.5mm;
  }
  .ack-name-en {
    font-family: 'Fraunces', serif;
    font-size: 6.2mm; font-weight: 700; letter-spacing: 1px;
    color: #3e2410; margin-top: 0.5mm; font-style: italic;
  }
  .ack-name-sub {
    font-family: 'Noto Serif TC', 'Fraunces', serif;
    font-size: 2.8mm; font-weight: 600; letter-spacing: 1px;
    color: #7c2d2d;
  }
  .ack-affil {
    font-family: 'Noto Sans TC', 'Inter', sans-serif;
    font-size: 2.3mm; line-height: 1.55; letter-spacing: 0.3px;
    color: #5e4a2e; margin-top: 1mm;
    font-weight: 500;
  }
  .ack-bot {
    position: relative; z-index: 2;
    text-align: center;
    margin-top: auto;
    padding-bottom: 1mm;
  }
  .ack-contrib {
    font-family: 'Noto Serif TC', 'Fraunces', serif;
    font-size: 2.4mm; line-height: 1.65; letter-spacing: 0.4px;
    color: #4a3820; font-style: italic;
    max-width: 62mm; margin: 0 auto;
  }
  .ack-signature {
    font-family: 'Fraunces', 'Noto Serif TC', serif;
    font-size: 2.1mm; letter-spacing: 2px; font-weight: 500;
    color: #7c2d2d; margin-top: 2mm;
    font-style: italic;
  }
  /* Wax-seal style stamp */
  .ack-seal {
    position: absolute;
    right: 5.5mm; bottom: 5mm;
    width: 14mm; height: 14mm;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #a53a3a, #7c2d2d 55%, #5a1e1e);
    box-shadow:
      0 1.2mm 2.5mm rgba(124,45,45,0.35),
      inset 0 0.3mm 0.6mm rgba(255,255,255,0.15),
      inset 0 -0.5mm 1mm rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    z-index: 3;
    transform: rotate(-8deg);
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .ack-seal::before {
    content: ''; position: absolute; inset: 0.8mm;
    border: 0.15mm dashed rgba(255,230,200,0.45);
    border-radius: 50%;
  }
  .ack-seal-text {
    font-family: 'Fraunces', 'Noto Serif TC', serif;
    font-size: 1.7mm; font-weight: 700; letter-spacing: 0.5px;
    color: #ffe6c8; text-align: center; line-height: 1.15;
    position: relative; z-index: 1;
    text-shadow: 0 0.2mm 0.4mm rgba(0,0,0,0.4);
  }
  .ack-seal-yr {
    font-size: 1.4mm; letter-spacing: 1px; opacity: 0.8;
    display: block; margin-top: 0.3mm;
  }
  .card-face:hover .ack-seal { transform: rotate(-4deg) scale(1.04); }
  /* Hide company logo/name bar on ack cards (they are NOT employees) */
  .style-ack .top, .style-ack .bot, .style-ack .mid { display: none; }
  /* QR — honoree's own site/lab, mirrored opposite the aIwalk wax seal */
  .ack-qr {
    position: absolute;
    left: 5.5mm; bottom: 5mm;
    width: 14mm; height: 14mm;
    background: #fdf6e4;
    padding: 0.8mm;
    border-radius: 1mm;
    box-shadow: 0 0.8mm 1.8mm rgba(94,58,28,0.22),
                inset 0 0 0 0.15mm rgba(154,122,62,0.55);
    display: block; z-index: 3;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .ack-qr img { width: 100%; height: 100%; display: block; }
  .ack-qr-caption {
    position: absolute;
    left: 5.5mm; bottom: 20.2mm;
    width: 14mm;
    font-family: 'Fraunces', 'Noto Serif TC', serif;
    font-size: 1.5mm; font-weight: 600; letter-spacing: 0.5px;
    color: #7c2d2d; text-align: center; line-height: 1.2;
    font-style: italic; z-index: 3;
  }
  .card-face:hover .ack-qr { transform: translateY(-0.3mm) scale(1.05); }
  /* Tighten ack-body when QR is present so text doesn't collide */
  .style-ack .ack-contrib { max-width: 78mm; }

  /* Slide transition for person switching */
  .stage-slide {
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
  }
  .stage-slide.exit-left { transform: translateX(-120%); opacity: 0; }
  .stage-slide.exit-right { transform: translateX(120%); opacity: 0; }
  .stage-slide.enter-left { transform: translateX(-60%); opacity: 0; }
  .stage-slide.enter-right { transform: translateX(60%); opacity: 0; }

  /* ===== NAV ===== */
  .nav-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(8px);
    border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #1a3a5c; transition: all 0.2s ease; z-index: 10;
  }
  .nav-arrow:hover { background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
  .nav-arrow.disabled { opacity: 0.2; pointer-events: none; }
  .nav-arrow svg { width: 20px; height: 20px; }
  .nav-prev { left: 12px; }
  .nav-next { right: 12px; }

  /* Dots + side indicator */
  .controls {
    display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 16px;
  }
  .dots { display: flex; gap: 10px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #d4cfc4; cursor: pointer; transition: all 0.3s ease;
  }
  .dot.active { background: #1a3a5c; transform: scale(1.2); }
  .side-label {
    font-size: 10px; color: #94a3b8; letter-spacing: 1px;
    transition: all 0.3s ease;
  }
  .side-label.zh { color: #1a3a5c; font-weight: 600; }

  /* Flip button */
  .flip-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; margin-top: 6px;
    border-radius: 24px; border: 1px solid rgba(26,58,92,0.15);
    background: rgba(255,255,255,0.8); backdrop-filter: blur(8px);
    font-size: 12px; font-weight: 600; color: #1a3a5c;
    cursor: pointer; transition: all 0.2s ease;
    letter-spacing: 0.3px;
  }
  .flip-btn:hover { background: #fff; border-color: #1a3a5c; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .flip-btn:active { transform: scale(0.97); }
  .flip-btn svg { width: 14px; height: 14px; transition: transform 0.3s ease; }
  .flip-btn.flipped svg { transform: rotate(180deg); }

  .swipe-hint {
    font-size: 10px; color: #b0a89a; letter-spacing: 0.5px;
    text-align: center; margin-top: 4px;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 760px) {
    .card-scene { width: 90vw; height: calc(90vw * 0.6); }
    .card-scene.is-ack { width: 94vw; height: calc(94vw * 0.72); }
    .stage { padding: 64px 12px 16px; }
    .nav-arrow { width: 36px; height: 36px; }
    .nav-arrow svg { width: 16px; height: 16px; }
    .nav-prev { left: 4px; }
    .nav-next { right: 4px; }
    .page-navbar { top: 10px; padding: 6px 12px; }
    .nav-back { font-size: 12px; padding: 4px 10px; }
    .nav-title { font-size: 12px; }
  }
  @media (max-width: 480px) {
    .card-scene { width: 94vw; height: calc(94vw * 0.6); }
    .card-scene.is-ack { width: 96vw; height: calc(96vw * 0.75); }
    .stage { padding: 58px 6px 12px; }
    .page-navbar { top: 8px; padding: 5px 10px; }
    .nav-title { display: none; }
    .person-label { font-size: 13px; }
    .controls { margin-top: 10px; }
  }
  @media print {
    body { overflow: visible; height: auto; }
    .page-navbar, .nav-arrow, .controls, .swipe-hint { display: none; }
    .stage { overflow: visible; padding: 20px; }
    .card-flipper { transform: none !important; }
    .card-face-back { display: none; }
  }

  /* ===== ADMIN (low-key trigger bottom-right + password + panel) ===== */
  .admin-trigger {
    position: fixed; right: 16px; bottom: 16px; z-index: 9998;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(26,58,92,0.12);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    display: flex; align-items: center; justify-content: center;
    opacity: 0.5; cursor: pointer; padding: 0;
    transition: opacity 0.25s ease, transform 0.25s ease,
                background 0.25s ease, box-shadow 0.25s ease;
    color: #6b7d8e;
  }
  .admin-trigger:hover {
    opacity: 1; color: #1a3a5c; transform: scale(1.05);
    background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,0.1);
  }
  .admin-trigger:focus-visible {
    outline: 2px solid #c06a1a; outline-offset: 2px; opacity: 1;
  }
  .admin-trigger svg { width: 16px; height: 16px; }
  @media (max-width: 480px) {
    .admin-trigger { right: 10px; bottom: 10px; width: 32px; height: 32px; }
    .admin-trigger svg { width: 14px; height: 14px; }
  }
  @media print { .admin-trigger { display: none; } }

  .admin-backdrop {
    position: fixed; inset: 0; z-index: 10001;
    background: rgba(20, 30, 45, 0.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .admin-backdrop.show { opacity: 1; pointer-events: auto; }

  .admin-dialog {
    background: #f8f6f1; border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: min(92vw, 360px); padding: 28px 28px 22px;
    transform: translateY(10px) scale(0.98); opacity: 0;
    transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), opacity 0.25s;
  }
  .admin-backdrop.show .admin-dialog { transform: translateY(0) scale(1); opacity: 1; }
  .admin-dialog h3 {
    font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 700;
    color: #1a2d42; letter-spacing: 1px; margin-bottom: 6px;
  }
  .admin-dialog p { font-size: 12px; color: #6b7d8e; font-weight: 500; margin-bottom: 16px; }
  .admin-dialog input[type="password"] {
    width: 100%; padding: 10px 14px; font-size: 14px;
    border: 1px solid rgba(26,58,92,0.2); border-radius: 8px;
    background: #fff; color: #1a2d42; font-family: inherit;
    transition: border-color 0.2s;
  }
  .admin-dialog input[type="password"]:focus {
    outline: none; border-color: #c06a1a;
  }
  .admin-dialog .admin-err {
    font-size: 11px; color: #c0392b; margin-top: 8px; min-height: 14px;
  }
  .admin-actions {
    display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px;
  }
  .admin-btn {
    padding: 8px 18px; font-size: 12px; font-weight: 600;
    border-radius: 22px; border: 1px solid rgba(26,58,92,0.2);
    background: transparent; color: #1a3a5c; cursor: pointer;
    font-family: inherit; letter-spacing: 0.5px; transition: all 0.2s;
  }
  .admin-btn:hover { background: rgba(26,58,92,0.06); }
  .admin-btn.primary {
    background: #1a3a5c; color: #f8f6f1; border-color: #1a3a5c;
  }
  .admin-btn.primary:hover { background: #0f2840; }

  /* Admin panel (list with checkboxes) */
  .admin-panel {
    position: fixed; inset: 0; z-index: 10002;
    background: #f8f6f1; overflow-y: auto;
    opacity: 0; pointer-events: none; transform: translateY(20px);
    transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.16,1,0.3,1);
  }

  .admin-panel-header {

    font-family: 'Noto Serif TC', serif; font-size: 24px; font-weight: 900;

  .admin-panel-body { padding: 0 48px 64px; }
  .admin-group { margin-bottom: 36px; }

    border-bottom: 1px solid rgba(26,58,92,0.12);

  .admin-group-num {

    color: #c06a1a; letter-spacing: 2px;
  }
  .admin-group-zh {
    font-family: 'Noto Serif TC', serif; font-size: 15px; font-weight: 700;
    color: #1a2d42; letter-spacing: 1.5px;
  }
  .admin-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; border-radius: 8px;
    background: #fff; border: 1px solid rgba(26,58,92,0.08);
    margin-bottom: 8px; transition: all 0.2s;
  }
  .admin-row:hover { border-color: rgba(26,58,92,0.2); }
  .admin-row.is-hidden { opacity: 0.55; background: #f0ebe1; }
  .admin-row input[type="checkbox"] {
    width: 18px; height: 18px; cursor: pointer; accent-color: #c06a1a;
  }
  .admin-row-main { flex: 1; min-width: 0; }
  .admin-row-name {

  }

  .admin-row-status.visible { background: rgba(30,120,70,0.1); color: #1e7846; }

  /* ============================================================
     OVERVIEW CARD — RICH VARIANT (with portrait slot + highlights)
     ============================================================ */
  .ov-card.has-profile {
    padding: 0;
    display: flex;
    flex-direction: column;
    min-height: 280px;
  }
  .ov-portrait {
    position: relative;
    aspect-ratio: 4 / 3;
    background: linear-gradient(135deg, #1a3a5c 0%, #2c5478 50%, #c06a1a 140%);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .ov-portrait img {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }
  .ov-portrait-monogram {
    font-family: 'Noto Serif TC', serif;
    font-size: 90px; font-weight: 900; line-height: 1;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 4px 24px rgba(0,0,0,0.25);
    letter-spacing: 0;
  }
  .ov-portrait::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 30% 30%, rgba(255,255,255,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 90% 60% at 70% 90%, rgba(0,0,0,0.20) 0%, transparent 70%);
    pointer-events: none;
  }
  /* Bottom-edge ribbon on profile cards — clearly labels the action so users
     know clicking opens a full bio, not the business-card flip. */
  .ov-portrait-ribbon {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    background: linear-gradient(180deg, rgba(15,29,45,0) 0%, rgba(15,29,45,0.85) 60%, rgba(15,29,45,0.95) 100%);
    color: #fff;
    font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 2;
    transition: background 0.25s ease;
  }
  .ov-portrait-ribbon .ov-ribbon-label { display: flex; align-items: baseline; gap: 6px; }
  .ov-portrait-ribbon .ov-ribbon-label .lbl-zh,
  .ov-portrait-ribbon .ov-ribbon-label .lbl-en { letter-spacing: 1.5px; }
  .ov-portrait-ribbon .ov-ribbon-arrow {
    color: #ffb274; font-size: 18px; line-height: 1; font-weight: 700;
    transform: translateX(0); transition: transform 0.25s ease;
  }
  .ov-card:hover .ov-portrait-ribbon { background: linear-gradient(180deg, rgba(15,29,45,0.1) 0%, rgba(192,106,26,0.92) 100%); }
  .ov-card:hover .ov-portrait-ribbon .ov-ribbon-arrow { transform: translateX(4px); }

  .ov-meta { padding: 18px 20px 18px; flex: 1; display: flex; flex-direction: column; }
  .ov-card.has-profile .ov-name-primary { font-size: 22px; margin-bottom: 4px; }
  body[data-lang="en"] .ov-card.has-profile .ov-name-primary { font-size: 18px; }
  .ov-card.has-profile .ov-name-secondary { margin-bottom: 12px; }
  .ov-card.has-profile .ov-role { margin-bottom: 12px; }
  .ov-highlights {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-top: auto;
  }
  .ov-chip {
    font-size: 10px; font-weight: 600;
    padding: 3px 8px;
    background: rgba(26,58,92,0.06);
    color: #1a3a5c;
    border-radius: 100px;
    letter-spacing: 0.2px;
    line-height: 1.4;
  }
  .ov-chip.lbl-en { background: rgba(192,106,26,0.08); color: #8a4d12; }

  /* Hint line at the bottom of plain (no-profile) cards so the destination
     is also explicit there — visually quieter than the ribbon above. */
  .ov-card:not(.has-profile) .ov-action-hint {
    margin-top: auto; padding-top: 12px;
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: #94a3b8;
    border-top: 1px dashed rgba(26,58,92,0.12);
  }
  .ov-card:not(.has-profile) .ov-action-hint .ov-hint-arrow {
    margin-left: auto; color: #c06a1a; transition: transform 0.25s ease;
  }
  .ov-card:not(.has-profile):hover .ov-action-hint { color: #1a3a5c; }
  .ov-card:not(.has-profile):hover .ov-hint-arrow { transform: translateX(3px); }

function loadHiddenSet() {
  try {
    const raw = localStorage.getItem(HIDDEN_KEY);
    if (raw === null) return new Set(DEFAULT_HIDDEN);
    const arr = JSON.parse(raw);
    return new Set(Array.isArray(arr) ? arr : DEFAULT_HIDDEN);
  } catch (e) { return new Set(DEFAULT_HIDDEN); }
}
function saveHiddenSet(set) {
  localStorage.setItem(HIDDEN_KEY, JSON.stringify([...set]));

// Create dots (driven by VP = visible people; rebuilt when admin toggles)
function rebuildDots() {
  dotsEl.innerHTML = '';
  VP.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === current ? ' active' : '');
    d.addEventListener('click', () => goToPerson(i));
    dotsEl.appendChild(d);
  });

const ACK_IDS = new Set(['chen-youyin', 'eric']);
function renderPerson(idx) {
  if (!VP.length) return; // nothing visible
  if (idx < 0 || idx >= VP.length) idx = 0;
  const p = VP[idx];
  label.textContent = p.name;
  sublabel.textContent = p.sub;
  frontEl.innerHTML = p.front;
  backEl.innerHTML = p.back;
  // Acknowledgment cards use a larger, distinct format
  scene.classList.toggle('is-ack', ACK_IDS.has(p.id));
  dotsEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
  btnPrev.classList.toggle('disabled', idx === 0);
  btnNext.classList.toggle('disabled', idx === VP.length - 1);
  // Team view's authoritative URL lives in ?profile=…; writing #arthur here
  // would pollute deep links like ?view=team&profile=lin.
  if (!IS_TEAM_VIEW) history.replaceState(null, null, '#' + p.id);
}

const flipBtnText = document.getElementById('flipBtnText');

// Bilingual UI texts
const uiTexts = {
  en: {
    front: 'FRONT (中文)',
    back: 'BACK (EN)',
    swipeDown: 'Swipe down for back ↓',
    swipeUp: 'Swipe up for front ↑',
    hint: '← → Switch | Click or ↑↓ to flip'
  },
  zh: {

    swipeUp: '上滑回正面 ↑',
    hint: '← → 換人 | 點擊翻面 或 ↑↓ 鍵'
  }
};

function updateUIText() {
  const t = uiTexts[currentLang];
  hint.textContent = t.hint;
  sideLabel.textContent = isFlipped ? t.back : t.front;
  flipBtnText.textContent = isFlipped ? t.swipeUp : t.swipeDown;
  document.body.setAttribute('data-lang', currentLang);
}

function setFlip(flip) {
  isFlipped = flip;
  currentLang = flip ? 'en' : 'zh';
  flipper.classList.toggle('flipped', flip);
  flipBtn.classList.toggle('flipped', flip);
  sideLabel.classList.toggle('zh', !flip);
  updateUIText();
  // Update icon direction
  const icon = document.getElementById('flipBtnIcon');
  if (flip) {
    icon.innerHTML = '<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>';
  } else {
    icon.innerHTML = '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>';
  }
  // Sync language with index.html (back = EN, front = ZH)
  localStorage.setItem('aiwalk-lang', flip ? 'en' : 'zh');
}

flipBtn.addEventListener('click', () => setFlip(!isFlipped));

function goToPerson(idx, direction) {
  if (idx < 0 || idx >= VP.length || idx === current) return;
  const dir = direction || (idx > current ? 'left' : 'right');
  const keepFlipped = isFlipped;  // Remember current flip state
  // Exit animation
  scene.classList.add('exit-' + dir);
  setTimeout(() => {
    current = idx;
    setFlip(keepFlipped);  // Maintain language/flip state
    renderPerson(idx);
    scene.classList.remove('exit-' + dir);
    scene.classList.add('enter-' + (dir === 'left' ? 'right' : 'left'));
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        scene.classList.remove('enter-right', 'enter-left');
      });
    });
  }, 280);
}

// Arrow buttons
btnPrev.addEventListener('click', () => goToPerson(current - 1, 'right'));
btnNext.addEventListener('click', () => goToPerson(current + 1, 'left'));

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') goToPerson(current - 1, 'right');
  if (e.key === 'ArrowRight') goToPerson(current + 1, 'left');
  if (e.key === 'ArrowDown') { e.preventDefault(); setFlip(true); }
  if (e.key === 'ArrowUp') { e.preventDefault(); setFlip(false); }
});

// Touch swipe — horizontal = switch person, vertical = flip
let tx0 = 0, ty0 = 0, swiping = false;
const stageEl = document.getElementById('stage');
stageEl.addEventListener('touchstart', (e) => {
  tx0 = e.touches[0].clientX;
  ty0 = e.touches[0].clientY;
  swiping = true;
}, { passive: true });
stageEl.addEventListener('touchend', (e) => {
  if (!swiping) return;
  swiping = false;
  const dx = e.changedTouches[0].clientX - tx0;
  const dy = e.changedTouches[0].clientY - ty0;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  if (absDx < 30 && absDy < 30) return; // tap, not swipe
  if (absDx > absDy) {
    // Horizontal swipe
    if (dx < -50) goToPerson(current + 1, 'left');
    else if (dx > 50) goToPerson(current - 1, 'right');
  } else {
    // Vertical swipe
    if (dy > 40) setFlip(true);    // down = flip to back
    else if (dy < -40) setFlip(false); // up = flip to front
  }
});

// Hide hint after first interaction
let hintShown = true;
function hideHint() {
  if (hintShown) { hint.style.opacity = '0'; hintShown = false; }
}
stageEl.addEventListener('touchstart', hideHint, { once: true });
document.addEventListener('keydown', hideHint, { once: true });

            ${namePrimaryHTML}
            ${nameSecondaryHTML}
            ${roleHTML}
            ${chips ? `<div class="ov-highlights">${chips}</div>` : ''}
          </div>
        </button>`;
      }
      return `<button class="ov-card" data-id="${p.id}">
        ${namePrimaryHTML}
        ${nameSecondaryHTML}
        ${roleHTML}
        <div class="ov-action-hint">
          <span class="lbl-zh">數位名片</span><span class="lbl-en">Business Card</span>
          <span class="ov-hint-arrow" aria-hidden="true">→</span>

    return `<div class="overview-group">
      <div class="overview-group-head">
        <span class="overview-group-num">${g.num}</span>
        <span class="overview-group-zh">${g.zh}</span>
        <span class="overview-group-en">${g.en}</span>
      </div>
      <div class="overview-grid">${members}</div>
    </div>`;
  }).join('');
  overviewBody.querySelectorAll('.ov-card').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      // Profile-equipped: just open profile — keep the underlying card
      // untouched so there's no flicker/race behind the panel.
      if (btn.dataset.hasProfile === '1') {
        openProfile(id);
        return;
      }
      // Plain person: flip directly to the business card.
      const idx = VP.findIndex(p => p.id === id);
      if (idx !== -1) {
        current = idx;
        renderPerson(idx);
        closeOverview();
      }
    });
  });
}

// ===== PROFILE DETAIL =====
const profilePanel = document.getElementById('profilePanel');
const profileBody = document.getElementById('profileBody');
const btnProfileBack = document.getElementById('btnProfileBack');

function renderProfile(id) {
  const p = PEOPLE.find(x => x.id === id);
  if (!p || !p.profile) { profileBody.innerHTML = ''; return; }
  const pf = p.profile;
  const portraitInner = pf.headshot
    ? `<img src="${escHTML(pf.headshot)}" alt="${escHTML(pf.nameZh)}">`
    : `<span class="profile-portrait-monogram">${escHTML(pf.monogram || (p.name && p.name[0]) || '·')}</span>`;
  const chipsHTML = (pf.highlights || []).map(h =>
    `<span class="profile-chip lbl-zh">${escHTML(h.zh)}</span><span class="profile-chip lbl-en">${escHTML(h.en)}</span>`
  ).join('');
  const eduHTML = (pf.education || []).map((e, i) => `
    <li class="profile-list-item">
      <span class="profile-list-marker">0${i + 1}</span>
      <div class="profile-list-content">
        <div class="profile-item-primary"><span class="lbl-zh">${escHTML(e.degZh)}</span><span class="lbl-en">${escHTML(e.degEn)}</span></div>
        <div class="profile-item-secondary"><span class="lbl-zh">${escHTML(e.orgZh)}</span><span class="lbl-en">${escHTML(e.orgEn)}</span></div>
      </div>
    </li>`).join('');
  const expHTML = (pf.experience || []).map((e, i) => `
    <li class="profile-list-item">
      <span class="profile-list-marker">0${i + 1}</span>
      <div class="profile-list-content">
        <div class="profile-item-primary"><span class="lbl-zh">${escHTML(e.orgZh)}</span><span class="lbl-en">${escHTML(e.orgEn)}</span></div>
        <div class="profile-item-secondary"><span class="lbl-zh">${escHTML(e.roleZh)}</span><span class="lbl-en">${escHTML(e.roleEn)}</span></div>
        ${(e.noteZh || e.noteEn) ? `<div class="profile-item-note"><span class="lbl-zh">${escHTML(e.noteZh || '')}</span><span class="lbl-en">${escHTML(e.noteEn || '')}</span></div>` : ''}
      </div>
    </li>`).join('');

  profileBody.innerHTML = `
    <section class="profile-hero">
      <div class="profile-portrait">${portraitInner}</div>
      <div class="profile-headlines">
        <div class="profile-role-tag"><span class="lbl-zh">${escHTML(pf.titleZh)}</span><span class="lbl-en">${escHTML(pf.titleEn)}</span></div>
        <div class="profile-name-primary"><span class="lbl-zh">${escHTML(pf.nameZh)}</span><span class="lbl-en">${escHTML(pf.nameEn)}</span></div>
        <div class="profile-name-secondary"><span class="lbl-zh">${escHTML(pf.nameEn)}</span><span class="lbl-en">${escHTML(pf.nameZh)}</span></div>
        ${chipsHTML ? `<div class="profile-highlights">${chipsHTML}</div>` : ''}
      </div>
    </section>
    <div class="profile-body">
      <div class="profile-body-left">
        ${eduHTML ? `
        <section class="profile-section">
          <div class="profile-section-head">
            <span class="profile-section-num">01</span>
            <span class="profile-section-title-zh"><span class="lbl-zh">學歷</span><span class="lbl-en">Education</span></span>
            <span class="profile-section-title-en">Education</span>
          </div>
          <ul class="profile-list">${eduHTML}</ul>
        </section>` : ''}
        ${expHTML ? `
        <section class="profile-section">
          <div class="profile-section-head">
            <span class="profile-section-num">02</span>
            <span class="profile-section-title-zh"><span class="lbl-zh">經歷</span><span class="lbl-en">Experience</span></span>
            <span class="profile-section-title-en">Experience</span>
          </div>
          <ul class="profile-list">${expHTML}</ul>
        </section>` : ''}
      </div>
      <div class="profile-body-right">
        <section class="profile-section">
          <div class="profile-section-head">
            <span class="profile-section-num">03</span>
            <span class="profile-section-title-zh"><span class="lbl-zh">簡介</span><span class="lbl-en">Biography</span></span>
            <span class="profile-section-title-en">Biography</span>
          </div>
          <div class="profile-bio"><span class="lbl-zh">${escHTML(pf.bioZh)}</span><span class="lbl-en">${escHTML(pf.bioEn)}</span></div>
          <div class="profile-cta">
            <button class="profile-cta-btn" data-action="view-card" data-id="${p.id}">
              <span class="lbl-zh">查看名片</span><span class="lbl-en">View Business Card</span>
            </button>
          </div>
        </section>
      </div>
    </div>
  `;
  // Wire CTA buttons
  profileBody.querySelectorAll('.profile-cta-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      if (action === 'view-card') {
        const cardId = btn.dataset.id;
        const idx = VP.findIndex(x => x.id === cardId);
        if (idx !== -1) {
          current = idx;
          renderPerson(idx);
          closeProfile(false);   // don't bounce back to overview, land on the card
          closeOverview();       // belt-and-braces in case overview is somehow still showing
        }
      } else if (action === 'back') {
        closeProfile();          // default → restore overview if user came from there
      }
    });
  });
}

// Tracks whether the user opened profile from overview, so 'back' can
// restore the previous layer instead of falling through to the card.
let profileCameFromOverview = false;
const TEAM_TITLE = '智意行科技 Management Team — Team Overview';

function setProfileUrl(id) {
  const u = new URL(window.location.href);
  u.searchParams.set('view', 'team');
  if (id) u.searchParams.set('profile', id);
  else u.searchParams.delete('profile');
  return u.pathname + u.search;
}

function openProfile(id, fromUrl = false) {
  renderProfile(id);
  profileCameFromOverview = overview.classList.contains('show');
  if (profileCameFromOverview) overview.classList.remove('show'); // hide the layer underneath
  profilePanel.classList.add('show');
  profilePanel.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  // Give the profile its own URL — pushState so browser back closes it
  if (!fromUrl) {
    history.pushState({ profile: id }, '', setProfileUrl(id));
  }
  const p = PEOPLE.find(x => x.id === id);
  if (p) {
    const zh = p.nameZh || p.name || '';
    const en = p.nameEn || '';
    document.title = (zh && en && zh !== en) ? `${zh} / ${en} — aIwalk Management Team` : `${zh || en} — aIwalk Management Team`;
  }
}
function closeProfile(restoreOverview = profileCameFromOverview, fromUrl = false) {
  profilePanel.classList.remove('show');
  if (restoreOverview) {
    overview.classList.add('show');
  } else {
    document.body.style.overflow = '';
  }
  profileCameFromOverview = false;
  if (!fromUrl) {
    if (history.state && history.state.profile) {
      history.back(); // unwind the pushState entry → triggers popstate → no-op (panel already closed)
    } else {
      // edge case: arrived directly with ?profile=xxx — replace state to drop param
      history.replaceState(null, '', setProfileUrl(null));
    }
  }
  document.title = TEAM_TITLE;
}

// Browser back/forward sync
window.addEventListener('popstate', () => {
  const params = new URLSearchParams(window.location.search);
  const profileId = params.get('profile');
  const onTeam = params.get('view') === 'team';
  if (profileId && !profilePanel.classList.contains('show')) {
    // Forward navigation (or direct URL load) into a profile
    if (onTeam && !overview.classList.contains('show')) overview.classList.add('show');
    openProfile(profileId, true);
  } else if (!profileId) {
    // Back navigation out of profile
    if (profilePanel.classList.contains('show')) {
      // restoreOverview if URL still says we're in team view
      closeProfile(onTeam, true);
    }
    // If we also left team view (browser back from team to card view), close overview
    if (!onTeam && overview.classList.contains('show')) {
      overview.classList.remove('show');
      document.body.style.overflow = '';
      document.body.classList.remove('team-view');
    }
  }
});
btnProfileBack.addEventListener('click', closeProfile);
// Profile's Esc handler runs first and stops further Esc handlers (overview's)
// from firing, so a single Escape only closes the topmost layer.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && profilePanel.classList.contains('show')) {
    closeProfile();
    e.stopImmediatePropagation();
  }
});

function openOverview() {
  renderOverview();
  overview.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeOverview() {
  overview.classList.remove('show');
  document.body.style.overflow = '';
}
btnOverview.addEventListener('click', openOverview);
btnCloseOverview.addEventListener('click', closeOverview);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && overview.classList.contains('show')) closeOverview();
});

// Language toggle inside overview / profile (mirrors the card flip's lang state)
function toggleOverlayLang() {
  // setFlip(true) → English (back side); setFlip(false) → 中文 (front side)
  const goEn = currentLang !== 'en';
  setFlip(goEn);
}
const btnOverviewLang = document.getElementById('btnOverviewLang');
const btnProfileLang = document.getElementById('btnProfileLang');
const btnNavLang = document.getElementById('btnNavLang');
if (btnOverviewLang) btnOverviewLang.addEventListener('click', toggleOverlayLang);
if (btnProfileLang) btnProfileLang.addEventListener('click', toggleOverlayLang);
if (btnNavLang) btnNavLang.addEventListener('click', toggleOverlayLang);

// Auto-open overview when arriving via team.html / ?view=team / #team
(function autoOpenTeamView() {
  if (IS_TEAM_VIEW) {
    document.title = TEAM_TITLE;
    document.body.classList.add('team-view');
    openOverview();
    const profileId = new URLSearchParams(window.location.search).get('profile');
    if (profileId && PEOPLE.find(p => p.id === profileId && p.profile)) {
      // fromUrl=true → don't pushState; arrived here directly
      openProfile(profileId, true);
    }
  }
})();

// Load language preference and set card side accordingly
const savedLang = localStorage.getItem('aiwalk-lang');
if (savedLang === 'en') {
  setFlip(true);  // Show back (English) side
} else {
  updateUIText();  // Initialize UI text for default (zh) state
}

// ===== ADMIN MODE =====
// Password is btoa-obfuscated (not real security — client-side only).
// To change: run btoa('your-new-password') in console and paste the result below.
const ADMIN_PWD_B64 = 'ZXhvcHVsc2UyMDI2'; // btoa('exopulse2026')
const ADMIN_SESSION_KEY = 'aiwalk-admin-session';

const adminTrigger   = document.getElementById('adminTrigger');
const adminBackdrop  = document.getElementById('adminBackdrop');
const adminPwdEl     = document.getElementById('adminPwd');
const adminErr       = document.getElementById('adminErr');
const adminCancel    = document.getElementById('adminCancel');
const adminSubmit    = document.getElementById('adminSubmit');
const adminPanel     = document.getElementById('adminPanel');
const adminPanelBody = document.getElementById('adminPanelBody');
const adminClose     = document.getElementById('adminClose');
const adminReset     = document.getElementById('adminReset');
const adminSaveClose = document.getElementById('adminSaveClose');

// Pending-hidden set (edits held in-memory until user hits 儲存並關閉)
let pendingHidden = new Set(hiddenSet);

function openAdminLogin() {
  // If already authenticated this session, skip password
  if (sessionStorage.getItem(ADMIN_SESSION_KEY) === '1') {
    openAdminPanel();
    return;
  }
  adminPwdEl.value = '';
  adminErr.textContent = '';
  adminBackdrop.classList.add('show');
  setTimeout(() => adminPwdEl.focus(), 50);
}
function closeAdminLogin() {
  adminBackdrop.classList.remove('show');
}
function verifyAdmin() {
  const input = adminPwdEl.value;
  if (!input) { adminErr.textContent = '請輸入密碼'; return; }
  if (btoa(input) === ADMIN_PWD_B64) {
    sessionStorage.setItem(ADMIN_SESSION_KEY, '1');
    closeAdminLogin();
    openAdminPanel();
  } else {
    adminErr.textContent = '密碼錯誤';
    adminPwdEl.select();
  }
}

function openAdminPanel() {
  pendingHidden = new Set(hiddenSet);
  pendingHiddenSections = new Set(hiddenSections);
  renderAdminPanel();
  adminPanel.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeAdminPanel() {
  adminPanel.classList.remove('show');
  document.body.style.overflow = '';
}

function renderAdminPanel() {
  // Collect IDs that appear in GROUPS (ordered), plus orphans at the end
  const grouped = new Set(GROUPS.flatMap(g => g.ids));
  const orphans = PEOPLE.filter(p => !grouped.has(p.id));
  const sections = GROUPS.map(g => ({
    num: g.num, zh: g.zh, en: g.en,
    people: g.ids.map(id => PEOPLE.find(p => p.id === id)).filter(Boolean)
  }));
  if (orphans.length) {
    sections.push({ num: '99', zh: '其他', en: 'Others', people: orphans });
  }
  const peopleHtml = sections.map(s => `
    <div class="admin-group">
      <div class="admin-group-head">
        <span class="admin-group-num">${s.num}</span>
        <span class="admin-group-zh">${s.zh}</span>
      </div>
      ${s.people.map(p => {
        const hidden = pendingHidden.has(p.id);
        const enMatch = p.back.match(/class="name-en">([^<]+)</);
        const enName = enMatch ? enMatch[1].trim() : '';
        return `<label class="admin-row ${hidden ? 'is-hidden' : ''}" data-id="${p.id}">
          <input type="checkbox" data-kind="person" data-id="${p.id}" ${hidden ? 'checked' : ''} />
          <div class="admin-row-main">
            <div class="admin-row-name">${p.name}${enName ? ` <span style="font-weight:400;color:#6b7d8e;font-size:12px;">· ${enName}</span>` : ''}</div>
            <div class="admin-row-sub">${p.sub}</div>
          </div>
          <span class="admin-row-status ${hidden ? 'hidden' : 'visible'}">${hidden ? '隱藏' : '顯示'}</span>
        </label>`;
      }).join('')}
    </div>
  `).join('');

  const sectionHtml = `
    <div class="admin-group">
      <div class="admin-group-head">
        <span class="admin-group-num">SE</span>
        <span class="admin-group-zh">頁面區段 / Page Sections</span>
      </div>
      ${SECTION_DEFS.map(s => {
        const hidden = pendingHiddenSections.has(s.id);
        return `<label class="admin-row ${hidden ? 'is-hidden' : ''}" data-id="${s.id}">
          <input type="checkbox" data-kind="section" data-id="${s.id}" ${hidden ? 'checked' : ''} />
          <div class="admin-row-main">
            <div class="admin-row-name">${s.zh} <span style="font-weight:400;color:#6b7d8e;font-size:12px;">· ${s.en}</span></div>
            <div class="admin-row-sub">${s.sub}</div>
          </div>
          <span class="admin-row-status ${hidden ? 'hidden' : 'visible'}">${hidden ? '隱藏' : '顯示'}</span>
        </label>`;
      }).join('')}
    </div>
  `;

  adminPanelBody.innerHTML = sectionHtml + peopleHtml;

  // Wire checkbox changes (prompt: checked = hidden)
  adminPanelBody.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const id = cb.dataset.id;
      const kind = cb.dataset.kind;
      const target = kind === 'section' ? pendingHiddenSections : pendingHidden;
      if (cb.checked) target.add(id); else target.delete(id);
      const row = cb.closest('.admin-row');
      const hidden = cb.checked;
      row.classList.toggle('is-hidden', hidden);
      const status = row.querySelector('.admin-row-status');
      status.textContent = hidden ? '隱藏' : '顯示';
      status.className = 'admin-row-status ' + (hidden ? 'hidden' : 'visible');
    });
  });
}

function applyVisibilityAndRefresh() {
  // Persist
  hiddenSet = new Set(pendingHidden);
  saveHiddenSet(hiddenSet);
  hiddenSections = new Set(pendingHiddenSections);
  saveHiddenSections(hiddenSections);
  // Recompute visible list, reset index if current person was hidden
  const prevId = VP[current] ? VP[current].id : null;
  recomputeVP();
  if (!VP.length) {
    // Everyone hidden — fall back by forcing current 0 and just clear card
    current = 0;
    label.textContent = '';
    sublabel.textContent = '';
    frontEl.innerHTML = '';
    backEl.innerHTML = '';
    dotsEl.innerHTML = '';
    btnPrev.classList.add('disabled');
    btnNext.classList.add('disabled');
    return;
  }
  const stillIdx = prevId ? VP.findIndex(p => p.id === prevId) : -1;
  current = stillIdx !== -1 ? stillIdx : 0;
  rebuildDots();
  renderPerson(current);
}

// Wire admin UI
adminTrigger.addEventListener('click', openAdminLogin);
adminCancel.addEventListener('click', closeAdminLogin);
adminSubmit.addEventListener('click', verifyAdmin);
adminPwdEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); verifyAdmin(); }
  if (e.key === 'Escape') closeAdminLogin();
});
adminBackdrop.addEventListener('click', (e) => {
  if (e.target === adminBackdrop) closeAdminLogin();
});
adminClose.addEventListener('click', () => {
  // Discard pending edits
  closeAdminPanel();
});
adminSaveClose.addEventListener('click', () => {
  applyVisibilityAndRefresh();
  closeAdminPanel();
});
adminReset.addEventListener('click', () => {
  pendingHidden = new Set(DEFAULT_HIDDEN);
  pendingHiddenSections = new Set(DEFAULT_HIDDEN_SECTIONS);
  renderAdminPanel();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (adminPanel.classList.contains('show')) closeAdminPanel();
    else if (adminBackdrop.classList.contains('show')) closeAdminLogin();
  }
});
</script>
